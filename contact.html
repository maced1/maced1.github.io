<h1>Contact</h1>
<p class="tagline">Send me a message and it'll land in my inbox.</p>

<form class="card contact-form" action="https://formsubmit.co/matthewleesiegel1@gmail.com" method="POST">
  <input type="hidden" name="_subject" value="New message from maced1.github.io">
  <input type="hidden" name="_next" value="https://maced1.github.io/thanks.html">
  <input type="hidden" name="_template" value="table">
  <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off">

  <label for="name">Name</label>
  <input id="name" type="text" name="name" required>

  <label for="email">Email</label>
  <input id="email" type="email" name="email" required>

  <label for="message">Message</label>
  <textarea id="message" name="message" rows="6" required></textarea>

  <button class="button primary" type="submit">Send message</button>
</form>
